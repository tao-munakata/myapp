name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -T \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'bash -s' < scripts/vps-deploy.sh

      - name: Notify success
        if: success()
        run: echo "🚀 manualine.tech デプロイ成功"

      - name: Notify failure
        if: failure()
        run: echo "❌ デプロイ失敗"
