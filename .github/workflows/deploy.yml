name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e

          echo "=== デプロイ開始 ==="

          # バックアップ
          timestamp=$(date +%Y%m%d-%H%M%S)
          mkdir -p /home/ubuntu/vps-backups

          if [ -d /opt/services/manualine.tech ]; then
            cp -r /opt/services/manualine.tech /home/ubuntu/vps-backups/manualine-$timestamp
            echo "✅ バックアップ完了: manualine-$timestamp"
          fi

          # コード取得（既存ディレクトリを削除して再クローン）
          rm -rf /opt/services/manualine.tech
          mkdir -p /opt/services/manualine.tech
          git clone https://github.com/tao-munakata/myapp.git /opt/services/manualine.tech
          cd /opt/services/manualine.tech

          echo "✅ コード取得完了"

          # ビルド & 起動
          docker compose -f docker-compose.prod.yml up -d --build
          echo "✅ コンテナ起動完了"

          # ヘルスチェック（最大30秒）
          for i in $(seq 1 6); do
            sleep 5
            if docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "✅ ヘルスチェック OK"
              exit 0
            fi
            echo "⏳ 起動待機中... ($i/6)"
          done

          echo "❌ コンテナ起動タイムアウト"
          docker compose -f docker-compose.prod.yml logs --tail=50
          exit 1
          ENDSSH

      - name: Notify success
        if: success()
        run: echo "🚀 manualine.tech デプロイ成功"

      - name: Notify failure
        if: failure()
        run: echo "❌ デプロイ失敗"
