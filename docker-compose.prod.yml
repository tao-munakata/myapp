
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp-app:prod
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://api:5000}
    restart: unless-stopped
    volumes: []
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: myapp-api:prod
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
    volumes: []
